# Dev only. timescaledb-ha bundles pgvector. Apply schema with: uv run python -m db.migrate
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: edgeos
      POSTGRES_PASSWORD: edgeos
      POSTGRES_DB: edgeos
    ports: ["5433:5432"]  # host 5433: avoids a local Postgres on 5432
    volumes:
      - pgdata:/home/postgres/pgdata/data
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
